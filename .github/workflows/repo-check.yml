name: repo-check

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'tools/**'
      - '*.md'
      - 'src/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --changed-since 需要基分支历史；浅克隆会让变更集退化成空集，同 PR co-change 静默失效。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doc dependencies
        # 这是代码仓，本仓没有 requirements.txt：只装文档检查要用的三个包，不装 PySide6/Pillow。
        run: python -m pip install "PyYAML>=6.0" "markdown-it-py>=3.0" "jsonschema>=4.20"
      - name: Invariants
        run: python tools/repo-kit/check_repo.py --root .
      - name: Truth co-change (specs.py 改了，DEVELOPMENT.md 必须同 PR)
        if: github.event_name == 'pull_request'
        run: python tools/repo-kit/check_repo.py --root . --changed-since "origin/${{ github.event.pull_request.base.ref }}"
      - name: Generated artifacts are up to date
        run: python tools/repo-kit/generate.py --root . --check
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check
